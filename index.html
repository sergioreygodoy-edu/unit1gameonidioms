<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play the Idiom: Sports Edition</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef3e6;--card:#fffdf6;--ink:#1d2b1f;--line:#1d2b1f;--accent:#2f7d4a;--hot:#e8a317;--muted:#5b6b5d;--btn2:#dfe8d2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12201a;--card:#1b2d24;--ink:#f1f0e4;--line:#f1f0e4;--accent:#5fc183;--hot:#f0b73a;--muted:#a3b4a7;--btn2:#26402f}}
:root[data-theme="dark"]{--bg:#12201a;--card:#1b2d24;--ink:#f1f0e4;--line:#f1f0e4;--accent:#5fc183;--hot:#f0b73a;--muted:#a3b4a7;--btn2:#26402f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:20px 14px}
main{width:100%;max-width:560px}
h1{font-family:"Arial Black","Impact",sans-serif;font-size:1.5rem;margin:0 0 4px;letter-spacing:.5px}
.sub{color:var(--muted);margin:0 0 16px;font-size:.95rem}
.bar{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:8px}
.track{height:8px;background:var(--btn2);border-radius:99px;overflow:hidden;margin-bottom:16px}
.fill{height:100%;background:var(--accent);width:0;transition:width .3s}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:24px 20px;box-shadow:6px 6px 0 var(--line);min-height:320px}
.emoji{font-size:clamp(2.6rem,12vw,4rem);text-align:center;line-height:1.25;margin:6px 0 14px;letter-spacing:.1em}
.prompt{text-align:center;color:var(--muted);margin:0}
.answer{display:none;margin-top:6px;border-top:2px dashed var(--muted);padding-top:14px}
.answer.on{display:block}
.idiom{font-family:"Arial Black",sans-serif;font-size:1.4rem;margin:0 0 10px;color:var(--accent);text-align:center}
.lbl{font-weight:700;font-size:.9rem;margin:10px 0 2px}
.answer p{margin:0;line-height:1.45}
.ex{font-style:italic;color:var(--muted)}
.btns{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px;margin-top:20px}
button{font:inherit;font-weight:700;padding:14px 8px;border-radius:14px;border:3px solid var(--line);background:var(--btn2);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--line)}
button.main{background:var(--hot);color:#1d2b1f}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
<h1>⚽ Play the Idiom 🏀</h1>
<p class="sub">Look at the emojis, guess the idiom's meaning, then check the answer.</p>
<div class="bar"><span id="count"></span><span>🏆</span></div>
<div class="track"><div class="fill" id="fill"></div></div>
<section class="card" aria-live="polite">
<div class="emoji" id="emoji"></div>
<p class="prompt" id="prompt">What does this idiom mean? 🤔</p>
<div class="answer" id="answer">
<h2 class="idiom" id="idiom"></h2>
<div class="lbl">🇬🇧 Meaning</div><p id="en"></p>
<div class="lbl">🇪🇸 En español</div><p id="es"></p>
<div class="lbl">✍️ Example</div><p class="ex" id="ex"></p>
</div>
</section>
<div class="btns">
<button id="back">⬅️ Go back</button>
<button id="show" class="main">👀 Show answer</button>
<button id="next">Next ➡️</button>
</div>
</main>
<script>
const D=[
["🎾➡️🙋","The ball is in your court","It is your turn to act or decide.","Te toca a ti decidir / actuar.","I've made my offer; now the ball is in your court."],
["🥊🛑🔔","Saved by the bell","Rescued from trouble at the last moment.","Salvado por la campana / de milagro.","I hadn't studied, but the fire alarm rang. Saved by the bell!"],
["🏈🪂🙏","A Hail Mary","A desperate attempt with little chance of success.","Un último intento desesperado.","Her final-minute idea was a Hail Mary, but it worked."],
["⚾🥎🥎🥎","Touch base","To contact someone briefly to share updates.","Ponerse en contacto / ponerse al día.","Let's touch base on Friday about the project."],
["🏁🏃‍♂️🚫🔙","Throw in the towel","To give up; to admit defeat.","Tirar la toalla.","After three failed tests, he threw in the towel."],
["⛳🌱🏌️‍♀️","Par for the course","Normal and expected, especially something bad.","Lo normal / lo de siempre.","Delays on Monday are par for the course."],
["🏀🔥🚫🥅","Slam dunk","An easy, guaranteed success.","Éxito seguro / pan comido.","The presentation was a slam dunk."],
["⚽🥅📏🏃","Move the goalposts","To change the rules unfairly during a task.","Cambiar las reglas del juego.","Every time we finish, the teacher moves the goalposts!"],
["🏇🐴🏁👀","Neck and neck","Very close in a competition.","Codo con codo / muy igualados.","The two students were neck and neck for first place."],
["🥊🧍‍♂️🚫👊","Down for the count","Defeated, or too tired or sick to continue.","Fuera de combate / K.O.","The flu had me down for the count all week."],
["⚾🔝⚡🏟️","Step up to the plate","To take responsibility and act when needed.","Dar un paso al frente / asumir el reto.","When the team needed a leader, Ana stepped up to the plate."],
["🏀🕐⏱️🔥","Buzzer beater","A success achieved at the very last second.","Lograrlo sobre la bocina / en el último segundo.","He submitted the essay as a buzzer beater."],
["🏁🏃‍♀️⬆️🌍","Jump the gun","To start something too soon.","Precipitarse / adelantarse.","Don't jump the gun; wait for the instructions."],
["🏉🔙🧍‍♂️🛡️","Drop the ball","To make a mistake by failing to do your job.","Fallar / meter la pata.","I dropped the ball and forgot the deadline."],
["🎣🏆🔄🆕","Level the playing field","To make a situation fair for everyone.","Igualar las condiciones / nivelar el terreno.","Free tutoring levels the playing field."],
["🏃‍♂️🏅🥇🎯","Win hands down","To win very easily.","Ganar con facilidad / de calle.","She won the debate hands down."],
["⚽🧍‍♂️📣🧑‍⚖️","Call the shots","To be the one in charge who makes decisions.","Llevar la batuta / mandar.","In this group project, Maria calls the shots."],
["🏀⏸️🧢","Take a rain check","To politely decline now but offer to do it later.","Dejarlo para otra ocasión.","I can't come today, but can I take a rain check?"],
["🏆🥈😬🔙","Back to square one","To start again from the beginning after failing.","Volver a empezar / a la casilla de salida.","The file was deleted, so we are back to square one."],
["⚽🏃‍♂️🛡️⏳","Run out the clock","To use time to protect an advantage or avoid action.","Hacer tiempo / dejar correr el reloj.","They ran out the clock to avoid answering questions."]
];
let i=0;const $=id=>document.getElementById(id);
function render(){const d=D[i];$("emoji").textContent=d[0];$("idiom").textContent=d[1];$("en").textContent=d[2];$("es").textContent=d[3];$("ex").textContent="“"+d[4]+"”";
$("answer").classList.remove("on");$("prompt").style.display="block";$("show").textContent="👀 Show answer";
$("count").textContent="Idiom "+(i+1)+" of "+D.length;$("fill").style.width=((i+1)/D.length*100)+"%";
$("back").disabled=i===0;$("next").disabled=i===D.length-1}
$("show").onclick=()=>{const a=$("answer");const on=a.classList.toggle("on");$("prompt").style.display=on?"none":"block";$("show").textContent=on?"🙈 Hide answer":"👀 Show answer"};
$("next").onclick=()=>{if(i<D.length-1){i++;render()}};
$("back").onclick=()=>{if(i>0){i--;render()}};
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")$("next").click();if(e.key==="ArrowLeft")$("back").click();if(e.key===" "&&document.activeElement.tagName!=="BUTTON"){e.preventDefault();$("show").click()}});
render();
</script>
</body>
</html>
